<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendeJá - Sistema de Agendamento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: #4a6cf7;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .tabs {
      display: flex;
      background: #f1f1f1;
    }
    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active {
      background: white;
      border-bottom: 3px solid #4a6cf7;
    }
    .content {
      padding: 30px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #4a6cf7;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #3b5cc4;
    }
    .hidden { display: none; }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: center;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>AgendeJá</h1>
    <p>Sistema de Agendamento</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab(1)">Login</div>
    <div class="tab" onclick="showTab(2)">Criar Conta</div>
    <div class="tab" onclick="showTab(3)">Agendar</div>
  </div>

  <!-- Login (continua local) -->
  <div id="tab1" class="content">
    <h2>Faça seu Login</h2>
    <input type="email" id="loginEmail" placeholder="E-mail" required>
    <input type="password" id="loginSenha" placeholder="Senha" required>
    <button onclick="fazerLogin()">Entrar</button>
  </div>

  <!-- Criar Conta -->
  <div id="tab2" class="content hidden">
    <h2>Criar Conta</h2>
    <form id="formCadastro" action="https://formsubmit.co/davipereireoliveira732@gmail.com" method="POST">
      <input type="text" name="nome" placeholder="Nome completo" required>
      <input type="email" name="email" placeholder="E-mail" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <input type="hidden" name="_subject" value="Nova Conta Criada - AgendeJá">
      <input type="hidden" name="_next" value="https://seusite.com/obrigado.html"> <!-- opcional -->
      <button type="submit">Cadastrar e Enviar por E-mail</button>
    </form>
  </div>

  <!-- Agendamento -->
  <div id="tab3" class="content hidden">
    <h2>Agendar Horário</h2>
    <p><strong>Período permitido:</strong> Sexta 18:00 → Domingo 19:00</p>
    
    <form id="formAgendamento" action="https://formsubmit.co/davipereireoliveira732@gmail.com" method="POST">
      <input type="text" name="nome_cliente" placeholder="Seu nome completo" required>
      <input type="email" name="email_cliente" placeholder="Seu e-mail" required>
      <input type="date" name="data" id="data" onchange="carregarHorarios()" required>
      <select name="horario" id="horario" required>
        <option value="">Selecione o horário</option>
      </select>
      <input type="text" name="servico" placeholder="Serviço desejado (ex: Corte, Manicure...)" required>
      
      <input type="hidden" name="_subject" value="Novo Agendamento - AgendeJá">
      <button type="submit">Confirmar Agendamento</button>
    </form>

    <div id="mensagem" class="message"></div>
  </div>
</div>

<script>
// Funções de login continuam locais (sem enviar e-mail)
let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
let usuarioLogado = null;

function showTab(tab) {
  document.querySelectorAll('.content').forEach(c => c.classList.add('hidden'));
  document.getElementById(`tab${tab}`).classList.remove('hidden');
  
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab-1].classList.add('active');
}

function fazerLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;

  const user = usuarios.find(u => u.email === email && u.senha === senha);

  if (user) {
    usuarioLogado = user;
    alert(`Bem-vindo(a), ${user.nome}!`);
    showTab(3);
  } else {
    alert("E-mail ou senha incorretos!");
  }
}

function carregarHorarios() {
  // mesma função da versão anterior (mantida)
  const dataStr = document.getElementById('data').value;
  if (!dataStr) return;

  const data = new Date(dataStr);
  const diaSemana = data.getDay();

  const select = document.getElementById('horario');
  select.innerHTML = '<option value="">Selecione o horário</option>';

  let inicio = 18, fim = 19;
  let permitido = false;

  if (diaSemana === 5) { inicio = 18; fim = 23; permitido = true; }      // Sexta
  else if (diaSemana === 6) { inicio = 0; fim = 23; permitido = true; }  // Sábado
  else if (diaSemana === 0) { inicio = 0; fim = 19; permitido = true; }  // Domingo

  if (!permitido) {
    alert("Agendamentos só permitidos de sexta (18h) até domingo (19h).");
    document.getElementById('data').value = '';
    return;
  }

  for (let h = inicio; h <= fim; h++) {
    const hora = `${h.toString().padStart(2, '0')}:00`;
    select.innerHTML += `<option value="\( {hora}"> \){hora}</option>`;
  }
}

// Inicia na aba de Login
showTab(1);
</script>

</body>
</html>
